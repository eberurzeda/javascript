<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nacionalidade</title>
</head>
<body>
      <h1>Portão por país de origem</h1>
    País de origem: <input type="text" name="txtpais" id="txtpais">
    <input type="button" value="Verificar" onclick="confirmar()">
    
    <div id="res"></div>
    
    <script>
        function confirmar() {
            var txtp = window.document.getElementById('txtpais')
            var res = window.document.getElementById('res')
            var pais = txtp.value

            res.innerHTML = `<p>Seu país de origem é: <strong>${pais}</strong></p>`

            if (pais.toLowerCase() == 'brasil') {
                res.innerHTML += `<p>Você é <strong>BRASILEIRO! Dirija-se ao portão 05.</strong></p>`
            } else {
                res.innerHTML += `<p>Você é <strong>ESTRANGEIRO!</strong> Dirija-se ao portão 10.</p>`
            }
            

        }
        
    </script>

</body>
</html>
